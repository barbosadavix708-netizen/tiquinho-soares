<!DOCTYPE html>
<html lang="pe-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>Pesquisa SenaiTec</title>
</head>
<body>
    <main>
     <header>
          <img src="./img/logo.png" alt="Logo do SenaiTec"
          width="200px" height="200px">
          <h1>Pesquisa SenaiTec</h1>
     </header>
      <section>
        <form action="" method="get">
            <fieldset>
                <legend>Dados pessoais</legend>

                <label for="UserName">Nome:</label>
            <input type="text" name="UserNome" id="UserNome"
            required> 
            <br>

            <label for="UserAge">Idade:</label>
            <input type="number" name="UserAge" id="UserAge"
            required min="12" max="100">
            <br>

            <label for="UserBirthDate">Data de Nascimento:</label>
            <input type="date" name="UserBirthDate" id="UserBirthDate">
            <br>

            <label for="UserEmail">Email:</label>
            <input type="email" name="UserEmail" id="UserEmail"
            required>
            <br>

            <label for="userPhone">Telefone:</label>
            <input type="tel" name="userPhone" id="userPhone"
            pattern="[0-1]{11}" placeholder="21999930595">
            <br>

            <label for="userImage">Upload da foto:</label>
            <input type="file" name="userImage" id="userImage">
            <br>
            </fieldset>
            <fieldset>
                <legend>Perfil</legend>
                <input type="radio" name="userGender" id="">
                <label for="userGender">Masculino</label>
                <br>
                <input type="radio" name="userGender" id="">
                <label for="userGender">Feminino</label>
                <br>
                <input type="radio" name="userGender" id="">
                <label for="userGender">Prefiro não informar</label>
                <br>

            <select name="userCivilStatus" id="userCivilStatus">
                <option value="">Selecione seu estado civil</option>
                <option value="solteiro">Solteiro(a)</option>
                <option value="casado">Casado(a)</option>
                <option value="divorciado">Divorciado(a)</option>
                <option value="viuvo">Viúvo(a)</option>
                <option value="uniaoEstavel">União Estável</option>
            </select>
            <br>
            <select name="userState" id="userState">
                <option value="">Selecione seu estado</option>
                <option value="AC">Acre</option>
                <option value="AL">Alagoas</option>
                <option value="AP">Amapá</option>
                <option value="AM">Amazonas</option>
                <option value="BA">Bahia</option>
                <option value="CE">Ceará</option>   
                <option value="DF">Distrito Federal</option>
                <option value="ES">Espírito Santo</option>
                <option value="GO">Goiás</option>
                <option value="MA">Maranhão</option>
                <option value="MT">Mato Grosso</option>
                <option value="MS">Mato Grosso do Sul</option>
                <option value="MG">Minas Gerais</option>
                <option value="PA">Pará</option>
                <option value="PB">Paraíba</option>
                <option value="PR">Paraná</option>
                <option value="PE">Pernambuco</option>
                <option value="PI">Piauí</option>
                <option value="RJ">Rio de Janeiro</option>
                <option value="RN">Rio Grande do Norte</option>
                <option value="RS">Rio Grande do Sul</option>
                <option value="RO">Rondônia</option>
                <option value="RR">Roraima</option>
                <option value="SC">Santa Catarina</option>
                <option value="SP">São Paulo</option>
                <option value="SE">Sergipe</option>
                <option value="TO">Tocantins</option>
            </select>
            <br>
    
            <input type="checkbox" name="userSocialMedia" id="userSocialMedia">
            <label for="userSocialMedia">Instagram</label>
            <br>
            <input type="checkbox" name="userSocialMedia" id="userSocialMedia2">
            <label for="userSocialMedia2">Facebook</label>
            <br>
            <input type="checkbox" name="userSocialMedia" id="userSocialMedia3">
            <label for="userSocialMedia3">LinkedIn</label>
            <br>
          <label for="userMusicStyle">Estilo musical</label>
            <input list="userMusicStyle" name="userMusicStyle" id="userMusic
            <datalist id="userMusicStyle">
                <option value="Rock">
                <option value="Pop">
                <option value="Sertanejo">
                <option value="Funk">
                <option value="Forró">
                <option value="Pagode">
            </datalist>
        </fieldset>
            <button type="submit">Enviar</button>

        </form>
      </section>
    </main>
</body>
</html>
